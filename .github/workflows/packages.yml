name: Publish public ax-tui to GitHub Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.2
        required: true
        type: string

concurrency:
  group: ax-tui-packages-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AX_TUI_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

  native-assets:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate native release tag
        run: pnpm exec tsx script/validate-release-tag.ts "$AX_TUI_RELEASE_TAG"

      - name: Stage verified native assets
        run: pnpm exec tsx script/stage-native-assets.ts .tmp/native-assets

      - name: Build release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx script/build-release-notes.ts "${AX_TUI_RELEASE_TAG#v}" .tmp/release-notes.md

      - name: Publish immutable native assets before the GitHub Packages package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$AX_TUI_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$AX_TUI_RELEASE_TAG" --verify-tag \
              --title "ax-tui $AX_TUI_RELEASE_TAG" \
              --notes-file .tmp/release-notes.md
          fi
          mkdir -p .tmp/native-published
          for asset in .tmp/native-assets/ax-tui-native-*; do
            asset_name="$(basename "$asset")"
            if gh release download "$AX_TUI_RELEASE_TAG" --pattern "$asset_name" --dir .tmp/native-published; then
              cmp "$asset" ".tmp/native-published/$asset_name"
            else
              gh release upload "$AX_TUI_RELEASE_TAG" "$asset"
              gh release download "$AX_TUI_RELEASE_TAG" --pattern "$asset_name" --dir .tmp/native-published
              cmp "$asset" ".tmp/native-published/$asset_name"
            fi
          done

  publish:
    permissions:
      contents: read
      packages: write
    needs: native-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@defai-digital"

      - run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: pnpm exec tsx script/validate-release-tag.ts "$AX_TUI_RELEASE_TAG"

      - name: Build
        run: pnpm run build

      - name: Check vendor integrity, patches, and spinner dist
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Verify public package payload
        run: pnpm run check:package

      - name: Publish public GitHub Packages package
        run: pnpm run publish:github
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify package remains public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          visibility="$(gh api /orgs/defai-digital/packages/npm/ax-tui --jq .visibility)"
          test "$visibility" = public
