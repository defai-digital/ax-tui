name: Publish ax-tui to JSR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string

concurrency:
  group: ax-tui-jsr-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AX_TUI_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  native-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate native release tag
        shell: bash
        run: |
          set -euo pipefail
          TUI_VERSION="$(node -p "require('./jsr.json').version")"
          test "$AX_TUI_RELEASE_TAG" = "v${TUI_VERSION}"
          test "$(node -p "require('./package.json').version")" = "$TUI_VERSION"

      - name: Stage verified native assets
        run: pnpm exec tsx script/stage-native-assets.ts .tmp/native-assets

      - name: Publish immutable native assets before the JSR package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$AX_TUI_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$AX_TUI_RELEASE_TAG" --verify-tag \
              --title "ax-tui $AX_TUI_RELEASE_TAG" \
              --notes "Manifest-verified native assets for the matching ax-tui JSR package."
          fi
          mkdir -p .tmp/native-published
          for asset in .tmp/native-assets/ax-tui-native-*; do
            asset_name="$(basename "$asset")"
            if gh release download "$AX_TUI_RELEASE_TAG" --pattern "$asset_name" --dir .tmp/native-published; then
              cmp "$asset" ".tmp/native-published/$asset_name"
            else
              gh release upload "$AX_TUI_RELEASE_TAG" "$asset"
              gh release download "$AX_TUI_RELEASE_TAG" --pattern "$asset_name" --dir .tmp/native-published
              cmp "$asset" ".tmp/native-published/$asset_name"
            fi
          done

  publish:
    needs: native-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          TUI_VERSION="$(node -p "require('./jsr.json').version")"
          EXPECTED_TAG="v${TUI_VERSION}"
          if [ "$AX_TUI_RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Release tag must be $EXPECTED_TAG, received $AX_TUI_RELEASE_TAG"
            exit 1
          fi

      - name: Build
        run: pnpm run build

      - name: Check vendor integrity, patches, and spinner dist
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Verify JSR package
        run: pnpm run check:jsr

      - name: Publish JSR package with provenance
        run: pnpm run publish:jsr
